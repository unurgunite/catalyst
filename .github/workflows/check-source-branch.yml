name: Check source branch
on:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # The branch name is attacker-controlled: pass it via env, never
      # interpolate `${{ ... }}` straight into the script.
      - env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ ! "$HEAD_REF" =~ ^(v|system/) ]]; then
            echo "PRs to master allowed only from v* or system/* branches"
            exit 1
          fi
