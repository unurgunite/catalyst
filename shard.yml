name: catalyst
version: 0.9.3
crystal: ">= 1.12.0"
license: MIT

authors:
  - unurgunite

description: |
  Static performance analysis for Crystal.
  Detects allocation anti-patterns, algorithmic complexity issues,
  and resource leaks before they reach production.

dependencies:
  # Zero runtime dependencies — uses built-in Crystal::Parser

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    version: 1.7.0
  ameba-method_length:
    github: unurgunite/ameba-method_length
    version: 0.1.1

scripts:
  # shards does a full mirror clone, so a consumer downloads bench/, spec/,
  # .github/ and this repo's own tooling alongside src/. Compiling the library
  # needs only src/ and scripts/generate_rules_require.cr, so drop the rest.
  # `shards install --skip-postinstall` keeps everything.
  postinstall: sh scripts/trim_shard.sh
